name: KhanaKyaBanau

options:
  bundleIdPrefix: in.khanakyabanau
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    # Captured from the signing Xcode set up on this machine. A Team ID is not a
    # secret — it ships inside every signed binary — and keeping it here means
    # `xcodegen generate` never drops your device-signing setup.
    DEVELOPMENT_TEAM: HL88YQFR35
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "12"
    CODE_SIGN_STYLE: Automatic
    # The simulator needs no signing identity; a device build supplies its own team.
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  KhanaKit:
    path: KhanaKit
  # Messaging only. Android deliberately avoids the full Firebase BoM for the same
  # reason: Analytics, Crashlytics and Performance are unused, and analytics is Mixpanel.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
  Mixpanel:
    url: https://github.com/mixpanel/mixpanel-swift
    from: "4.3.0"

targets:
  KhanaKyaBanau:
    type: application
    platform: iOS
    sources:
      # Info.plist and the entitlements are referenced by build settings; letting
      # them also land in Copy Bundle Resources makes the build fail with
      # "Multiple commands produce Info.plist".
      - path: App
        excludes:
          - "Info.plist"
          - "KhanaKyaBanau.entitlements"
          - "KhanaKyaBanau-Push.entitlements"
    dependencies:
      - target: KhanaKyaBanauWidgets
        embed: true
      - package: KhanaKit
        product: KhanaKit
      - package: Firebase
        product: FirebaseMessaging
      - package: Mixpanel
        product: Mixpanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.khanakyabanau.app
        PRODUCT_NAME: KhanaKyaBanau
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        DEVELOPMENT_ASSET_PATHS: ""
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        # MIXPANEL_TOKEN is deliberately not set here: a target setting would
        # override the xcconfig below. Release reads it from Analytics.xcconfig,
        # which picks up the gitignored Secrets.xcconfig when one exists. Debug
        # leaves it undefined — it expands to empty, so debug builds never write to
        # production funnels.
        ANALYTICS_ENABLED: "YES"
        # Swap to App/KhanaKyaBanau-Push.entitlements once you have a paid
        # membership and a real GoogleService-Info.plist.
        # Defaults to the widget entitlements, because the widget is a shipping
        # feature and a build without them produces one that can never work —
        # it renders "Tap to set up" forever and tapping cannot fix it.
        #
        # A contributor on a **free** Apple ID cannot provision an App Group or a
        # keychain group, so they opt *down* to the empty file:
        #     xcodegen generate
        #     xcodebuild ... KKB_ENTITLEMENTS=App/KhanaKyaBanau.entitlements \
        #                    KKB_WIDGET_ENTITLEMENTS=App/KhanaKyaBanau.entitlements
        # The app then behaves exactly as it did before widgets existed: the
        # container is nil, no snapshot is written, and nothing else changes.
        KKB_ENTITLEMENTS: App/KhanaKyaBanau-Widgets.entitlements
        CODE_SIGN_ENTITLEMENTS: "$(KKB_ENTITLEMENTS)"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
          # Explicitly blank, and explicitly here rather than in the base settings:
          # an exported MIXPANEL_TOKEN in the developer's shell (which is how the
          # Android build picks it up) arrives as a build setting, so leaving this
          # merely undefined would let a debug run write to the production funnel.
          # A target setting outranks the environment; this is the only thing that
          # actually keeps Debug quiet.
          MIXPANEL_TOKEN: ""
    configFiles:
      # Release only: an archive gets the real token, a debug run does not.
      Release: Analytics.xcconfig

  KhanaKyaBanauWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    dependencies:
      - package: KhanaKit
        product: KhanaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.khanakyabanau.app.widgets
        PRODUCT_NAME: KhanaKyaBanauWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        # Mirrors KKB_ENTITLEMENTS on the app target, and must match it: the two
        # processes share a container, so entitling one without the other gives a
        # widget that reads a file the app never writes.
        KKB_WIDGET_ENTITLEMENTS: App/KhanaKyaBanau-Widgets.entitlements
        CODE_SIGN_ENTITLEMENTS: "$(KKB_WIDGET_ENTITLEMENTS)"
        SKIP_INSTALL: "YES"

  KhanaKyaBanauUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: KhanaKyaBanau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.khanakyabanau.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: KhanaKyaBanau

  KhanaKyaBanauTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: KhanaKyaBanau
      - package: KhanaKit
        product: KhanaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.khanakyabanau.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  KhanaKyaBanau:
    build:
      targets:
        KhanaKyaBanau: all
        KhanaKyaBanauTests: [test]
        KhanaKyaBanauUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KhanaKyaBanauTests
        - KhanaKyaBanauUITests
      # The pure-logic suite lives in the local package and runs on any machine
      # with a Swift toolchain; this scheme also runs it inside Xcode.
      gatherCoverageData: true
    archive:
      config: Release
