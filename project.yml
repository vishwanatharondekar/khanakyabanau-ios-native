name: KhanaKyaBanau

options:
  bundleIdPrefix: in.khanakyabanau
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    # Captured from the signing Xcode set up on this machine. A Team ID is not a
    # secret — it ships inside every signed binary — and keeping it here means
    # `xcodegen generate` never drops your device-signing setup.
    DEVELOPMENT_TEAM: HL88YQFR35
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # The simulator needs no signing identity; a device build supplies its own team.
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  KhanaKit:
    path: KhanaKit
  # Messaging only. Android deliberately avoids the full Firebase BoM for the same
  # reason: Analytics, Crashlytics and Performance are unused, and analytics is Mixpanel.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
  Mixpanel:
    url: https://github.com/mixpanel/mixpanel-swift
    from: "4.3.0"

targets:
  KhanaKyaBanau:
    type: application
    platform: iOS
    sources:
      # Info.plist and the entitlements are referenced by build settings; letting
      # them also land in Copy Bundle Resources makes the build fail with
      # "Multiple commands produce Info.plist".
      - path: App
        excludes:
          - "Info.plist"
          - "KhanaKyaBanau.entitlements"
          - "KhanaKyaBanau-Push.entitlements"
    dependencies:
      - package: KhanaKit
        product: KhanaKit
      - package: Firebase
        product: FirebaseMessaging
      - package: Mixpanel
        product: Mixpanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.khanakyabanau.app
        PRODUCT_NAME: KhanaKyaBanau
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        DEVELOPMENT_ASSET_PATHS: ""
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        # Empty by default so debug builds never write to production funnels.
        MIXPANEL_TOKEN: ""
        ANALYTICS_ENABLED: "YES"
        # Swap to App/KhanaKyaBanau-Push.entitlements once you have a paid
        # membership and a real GoogleService-Info.plist.
        KKB_ENTITLEMENTS: App/KhanaKyaBanau.entitlements
        CODE_SIGN_ENTITLEMENTS: "$(KKB_ENTITLEMENTS)"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"

  KhanaKyaBanauUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: KhanaKyaBanau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.khanakyabanau.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: KhanaKyaBanau

  KhanaKyaBanauTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: KhanaKyaBanau
      - package: KhanaKit
        product: KhanaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.khanakyabanau.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  KhanaKyaBanau:
    build:
      targets:
        KhanaKyaBanau: all
        KhanaKyaBanauTests: [test]
        KhanaKyaBanauUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KhanaKyaBanauTests
        - KhanaKyaBanauUITests
      # The pure-logic suite lives in the local package and runs on any machine
      # with a Swift toolchain; this scheme also runs it inside Xcode.
      gatherCoverageData: true
    archive:
      config: Release
